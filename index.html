<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meli el perrito</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px 28px 36px;
            width: 320px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.8s ease-out;
        }

        .avatar {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: spin 8s linear infinite;
        }

        h1 {
            margin: 10px 0 6px;
            font-size: 22px;
            color: #333333;
        }

        .label {
            font-size: 13px;
            color: #888888;
            margin-top: 14px;
        }

        .value {
            font-size: 16px;
            font-weight: 600;
            color: #555555;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">
            <img src="perro.jpg" alt="Meli el perrito">
        </div>

        <div class="label">Usuario</div>
        <div class="value">Meli</div>

        <div class="label">Contraseña</div>
        <div class="value">el perrito</div>
    </div>
</body>
</html>
